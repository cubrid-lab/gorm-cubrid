name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **House rules**
        - File this issue in English.
        - For DDL or parse errors, include the exact failing SQL and the result of running
          it directly on the server with `csql`.
        - Verify any claimed reserved word against the CUBRID keyword list before reporting it.
        - Include a runnable reproduction.

  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, CUBRID version, OS, GORM version
      placeholder: |
        - Go: 1.22
        - CUBRID: 11.2
        - GORM: 1.25
        - OS: Ubuntu 22.04
    validations:
      required: true

  - type: textarea
    id: sql-verification
    attributes:
      label: DDL / SQL error verification
      description: >-
        Optional, but required when the report involves a DDL or parse error. Paste the exact
        failing SQL and the output of running it directly with `csql` on the server.
        Reserved-word claims must be checked against the CUBRID keyword list.
      render: shell
    validations:
      required: false
