name: Sync reviewed GORM release notes

on:
  push:
    branches: [main]
    paths:
      - "docs/releases/**"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate versioned notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in Path("docs/releases").glob("v*.md"):
              lines = file.read_text().rstrip().splitlines()
              assert lines[0].startswith(f"## {file.stem} ("), file
              assert lines[-1].startswith("**Full Changelog:**"), file
              assert not any("github.com/cubrid-labs/gorm-cubrid" in x for x in lines), file
              assert any(re.search(r" by @[A-Za-z0-9-]+$", x) for x in lines), file
          PY
      - name: Update existing GitHub Releases, preserving tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for note in docs/releases/v*.md; do
            tag=$(basename "$note" .md)
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$GH_REPO" --title "gorm-cubrid $tag" --notes-file "$note"
            fi
          done
